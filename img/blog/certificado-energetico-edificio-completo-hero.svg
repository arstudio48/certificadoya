<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Certificado energético de edificio completo de viviendas">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87ceeb"/>
      <stop offset="60%" stop-color="#cfe9f5"/>
      <stop offset="100%" stop-color="#eef7fb"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d8b8"/>
      <stop offset="100%" stop-color="#c9b48c"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6d4b"/>
      <stop offset="100%" stop-color="#6e543a"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3c8c40"/>
      <stop offset="100%" stop-color="#2f7234"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#79b85c"/>
      <stop offset="100%" stop-color="#5f9e47"/>
    </linearGradient>
    <linearGradient id="barC" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c3d24b"/>
      <stop offset="100%" stop-color="#a9b83a"/>
    </linearGradient>
    <linearGradient id="barD" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e8c94a"/>
      <stop offset="100%" stop-color="#d3af34"/>
    </linearGradient>
    <linearGradient id="barE" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e8a13c"/>
      <stop offset="100%" stop-color="#d18a2a"/>
    </linearGradient>
    <linearGradient id="barF" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e26a2b"/>
      <stop offset="100%" stop-color="#c65420"/>
    </linearGradient>
    <linearGradient id="barG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d8402f"/>
      <stop offset="100%" stop-color="#b92e1e"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8c4ae"/>
      <stop offset="100%" stop-color="#97a58e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="660" cy="90" r="42" fill="#ffd966" opacity="0.9"/>
  <circle cx="660" cy="90" r="55" fill="#ffd966" opacity="0.25"/>

  <!-- background buildings -->
  <rect x="60" y="170" width="120" height="230" fill="#d9cbb5" opacity="0.55"/>
  <rect x="85" y="195" width="18" height="26" fill="#b8a98f" opacity="0.5"/>
  <rect x="112" y="195" width="18" height="26" fill="#b8a98f" opacity="0.5"/>
  <rect x="139" y="195" width="18" height="26" fill="#b8a98f" opacity="0.5"/>
  <rect x="85" y="235" width="18" height="26" fill="#b8a98f" opacity="0.5"/>
  <rect x="112" y="235" width="18" height="26" fill="#b8a98f" opacity="0.5"/>
  <rect x="139" y="235" width="18" height="26" fill="#b8a98f" opacity="0.5"/>
  <rect x="620" y="190" width="130" height="210" fill="#d9c9b0" opacity="0.5"/>
  <rect x="640" y="215" width="18" height="24" fill="#b8a98f" opacity="0.5"/>
  <rect x="666" y="215" width="18" height="24" fill="#b8a98f" opacity="0.5"/>
  <rect x="692" y="215" width="18" height="24" fill="#b8a98f" opacity="0.5"/>
  <rect x="718" y="215" width="18" height="24" fill="#b8a98f" opacity="0.5"/>

  <!-- main building -->
  <polygon points="250,130 250,400 560,400 560,130" fill="url(#bldg)"/>
  <polygon points="240,130 405,80 570,130" fill="url(#roof)"/>
  <rect x="250" y="130" width="310" height="10" fill="#8a6d4b"/>

  <!-- floors windows -->
  <g fill="#ffffff" stroke="#8f7a55" stroke-width="1.5">
    <rect x="280" y="160" width="34" height="40"/><rect x="328" y="160" width="34" height="40"/><rect x="376" y="160" width="34" height="40"/><rect x="424" y="160" width="34" height="40"/><rect x="472" y="160" width="34" height="40"/>
    <rect x="280" y="215" width="34" height="40"/><rect x="328" y="215" width="34" height="40"/><rect x="376" y="215" width="34" height="40"/><rect x="424" y="215" width="34" height="40"/><rect x="472" y="215" width="34" height="40"/>
    <rect x="280" y="270" width="34" height="40"/><rect x="328" y="270" width="34" height="40"/><rect x="376" y="270" width="34" height="40"/><rect x="424" y="270" width="34" height="40"/><rect x="472" y="270" width="34" height="40"/>
    <rect x="280" y="325" width="34" height="40"/><rect x="328" y="325" width="34" height="40"/><rect x="376" y="325" width="34" height="40"/><rect x="424" y="325" width="34" height="40"/><rect x="472" y="325" width="34" height="40"/>
  </g>
  <!-- door -->
  <rect x="368" y="340" width="45" height="60" rx="3" fill="#5d4a32"/>
  <circle cx="405" cy="372" r="2.5" fill="#d4af37"/>
  <!-- ground -->
  <rect x="0" y="400" width="800" height="100" fill="url(#ground)"/>
  <rect x="230" y="392" width="350" height="12" fill="#7d8a75" rx="3"/>

  <!-- energy label panel -->
  <g transform="translate(585,190)">
    <rect x="0" y="0" width="150" height="210" rx="8" fill="#ffffff" stroke="#2d3a1f" stroke-width="2"/>
    <text x="75" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2d3a1f" text-anchor="middle">ENERGÍA</text>
    <text x="75" y="42" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2d3a1f" text-anchor="middle">EDIFICIO COMPLETO</text>
    <rect x="18" y="52" width="42" height="16" rx="2" fill="url(#barA)"/><text x="42" y="64" font-family="Arial" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">A</text>
    <rect x="18" y="70" width="38" height="16" rx="2" fill="url(#barB)"/><text x="39" y="82" font-family="Arial" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">B</text>
    <rect x="18" y="88" width="34" height="16" rx="2" fill="url(#barC)"/><text x="36" y="100" font-family="Arial" font-size="10" font-weight="bold" fill="#2d3a1f" text-anchor="middle">C</text>
    <rect x="18" y="106" width="30" height="16" rx="2" fill="url(#barD)"/><text x="33" y="118" font-family="Arial" font-size="10" font-weight="bold" fill="#2d3a1f" text-anchor="middle">D</text>
    <rect x="18" y="124" width="62" height="16" rx="2" fill="url(#barE)"/><text x="49" y="136" font-family="Arial" font-size="10" font-weight="bold" fill="#2d3a1f" text-anchor="middle">E</text>
    <rect x="18" y="142" width="26" height="16" rx="2" fill="url(#barF)"/><text x="31" y="154" font-family="Arial" font-size="10" font-weight="bold" fill="#2d3a1f" text-anchor="middle">F</text>
    <rect x="18" y="160" width="22" height="16" rx="2" fill="url(#barG)"/><text x="29" y="172" font-family="Arial" font-size="10" font-weight="bold" fill="#2d3a1f" text-anchor="middle">G</text>
    <text x="75" y="200" font-family="Arial" font-size="10" fill="#4a5a3a" text-anchor="middle">Cada vivienda puede tener letra distinta</text>
  </g>

  <!-- checkmark badge -->
  <g transform="translate(30,440)">
    <circle cx="20" cy="20" r="19" fill="#16a34a" opacity="0.15"/>
    <circle cx="20" cy="20" r="14" fill="#16a34a"/>
    <path d="M13 20 L18 25 L28 14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="17" font-family="Arial" font-size="13" font-weight="bold" fill="#2d3a1f">Certificado de edificio completo</text>
    <text x="46" y="34" font-family="Arial" font-size="11" fill="#4a5a3a">Venta · Alquiler · Terciario · Registro CCAA</text>
  </g>
</svg>