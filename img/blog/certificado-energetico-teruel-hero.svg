<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Certificado energético en Teruel">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="house2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15803d"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <rect x="60" y="380" width="680" height="40" rx="6" fill="#bfdbfe"/>
  <!-- montañas -->
  <polygon points="0,300 140,160 300,300" fill="#93c5fd"/>
  <polygon points="180,300 360,130 540,300" fill="#60a5fa"/>
  <polygon points="420,300 620,140 800,300" fill="#93c5fd"/>
  <!-- casa -->
  <polygon points="240,180 400,90 560,180" fill="#1e3a8a"/>
  <rect x="240" y="180" width="320" height="200" rx="4" fill="url(#house2)"/>
  <rect x="300" y="230" width="70" height="90" rx="3" fill="#dcfce7"/>
  <rect x="420" y="230" width="70" height="90" rx="3" fill="#dcfce7"/>
  <rect x="370" y="290" width="60" height="90" rx="3" fill="#166534"/>
  <!-- etiqueta A-G -->
  <g transform="translate(600,110)">
    <rect x="0" y="0" width="80" height="120" rx="8" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <rect x="10" y="10" width="60" height="14" fill="#16a34a"/>
    <rect x="10" y="30" width="60" height="14" fill="#65a30d"/>
    <rect x="10" y="50" width="60" height="14" fill="#eab308"/>
    <rect x="10" y="70" width="60" height="14" fill="#f97316"/>
    <rect x="10" y="90" width="60" height="14" fill="#dc2626"/>
    <text x="40" y="97" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">G</text>
  </g>
  <text x="60" y="60" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#1f2937">Certificado Energético Teruel</text>
  <text x="60" y="90" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">Aragón · desde 45€ · registro INAGA</text>
</svg>
