<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Casa rural con etiqueta energética CertificadoYa</title>
  <desc id="desc">Ilustración de una casa rural de piedra en el campo español con la escala de eficiencia energética A-G</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8d6f0"/>
      <stop offset="1" stop-color="#e8f4ee"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbf5a"/>
      <stop offset="1" stop-color="#6aa843"/>
    </linearGradient>
    <linearGradient id="houseWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8cdb8"/>
      <stop offset="1" stop-color="#bfb29a"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5502e"/>
      <stop offset="1" stop-color="#8f3b1f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="660" cy="85" r="38" fill="#f6d365" opacity="0.9"/>
  <!-- cloud -->
  <ellipse cx="220" cy="80" rx="55" ry="18" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="260" cy="72" rx="40" ry="14" fill="#fff" opacity="0.8"/>
  <!-- hills -->
  <path d="M0 320 Q 150 240 300 320 Q 450 400 600 310 T 800 300 L 800 500 L 0 500 Z" fill="#7bb450"/>
  <path d="M0 360 Q 200 300 400 370 Q 560 420 800 350 L 800 500 L 0 500 Z" fill="url(#hill)"/>
  <!-- path to house -->
  <path d="M330 415 Q 340 440 360 500 L 460 500 Q 470 440 440 415 Z" fill="#d9c9a8"/>
  <!-- main house -->
  <rect x="210" y="235" width="230" height="170" fill="url(#houseWall)" stroke="#9d9078" stroke-width="2"/>
  <rect x="205" y="225" width="240" height="20" fill="#a99e86"/>
  <path d="M170 240 L325 140 L480 240 Z" fill="url(#roof)" stroke="#7a2f15" stroke-width="2"/>
  <!-- chimney -->
  <rect x="390" y="140" width="20" height="50" fill="#a99e86"/>
  <ellipse cx="400" cy="135" rx="14" ry="8" fill="#c9bfaa"/>
  <circle cx="396" cy="118" r="9" fill="#bfb5b0" opacity="0.5"/>
  <!-- door -->
  <rect x="290" y="330" width="46" height="78" rx="23" ry="14" fill="#6d4c2f"/>
  <circle cx="330" cy="372" r="3" fill="#e8c86a"/>
  <!-- windows -->
  <rect x="238" y="270" width="38" height="34" rx="4" fill="#9cc8e6" stroke="#6f5f47" stroke-width="3"/>
  <line x1="257" y1="270" x2="257" y2="304" stroke="#6f5f47" stroke-width="3"/>
  <line x1="238" y1="287" x2="276" y2="287" stroke="#6f5f47" stroke-width="3"/>
  <rect x="372" y="270" width="38" height="34" rx="4" fill="#9cc8e6" stroke="#6f5f47" stroke-width="3"/>
  <line x1="391" y1="270" x2="391" y2="304" stroke="#6f5f47" stroke-width="3"/>
  <line x1="372" y1="287" x2="410" y2="287" stroke="#6f5f47" stroke-width="3"/>
  <!-- flowers/trees -->
  <circle cx="150" cy="360" r="26" fill="#5f9e3f"/>
  <rect x="146" y="360" width="8" height="28" fill="#8a6a45"/>
  <circle cx="490" cy="350" r="30" fill="#5f9e3f"/>
  <rect x="486" y="350" width="8" height="34" fill="#8a6a45"/>
  <circle cx="120" cy="330" r="8" fill="#f7d154"/>
  <circle cx="140" cy="342" r="6" fill="#f78fb3"/>
  <circle cx="548" cy="352" r="7" fill="#f7d154"/>
  <!-- energy label panel -->
  <g transform="translate(575,200)">
    <rect width="150" height="240" rx="10" fill="#ffffff" stroke="#d0d5cc" stroke-width="2"/>
    <text x="75" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">EFICIENCIA</text>
    <text x="75" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">ENERGÉTICA</text>
    <rect x="18" y="50" width="114" height="16" rx="3" fill="#17a35b"/><text x="33" y="62" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">A</text>
    <rect x="18" y="70" width="100" height="15" rx="3" fill="#3aa936"/><text x="33" y="82" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">B</text>
    <rect x="18" y="89" width="90" height="15" rx="3" fill="#d0c31f"/><text x="33" y="101" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">C</text>
    <rect x="18" y="108" width="80" height="15" rx="3" fill="#e8a62b"/><text x="33" y="120" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">D</text>
    <rect x="18" y="127" width="66" height="15" rx="3" fill="#e67e2e"/><text x="33" y="139" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">E</text>
    <rect x="18" y="146" width="52" height="15" rx="3" fill="#d8502f"/><text x="33" y="158" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">F</text>
    <rect x="18" y="165" width="40" height="15" rx="3" fill="#c0392b"/><text x="33" y="177" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">G</text>
    <rect x="18" y="196" width="114" height="30" rx="3" fill="#16a34a"/>
    <text x="34" y="208" font-family="Arial" font-size="9" font-weight="bold" fill="#fff">Desde 45 €</text>
    <text x="34" y="220" font-family="Arial" font-size="9" fill="#fff">en 24h</text>
  </g>
  <!-- branding -->
  <text x="60" y="478" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2d3a1f">certificadoya.es</text>
</svg>