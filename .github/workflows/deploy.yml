name: Deploy certificadoya.es (web-only)

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar dist con SOLO la web
        run: |
          mkdir -p dist
          # copiar todo, excluyendo directorios/archivos no-web (trabajo interno)
          rsync -a --exclude='.git' --exclude='.github' --exclude='.hermes' \
                --exclude='_scripts' --exclude='scripts' --exclude='_artifacts' \
                --exclude='supabase' --exclude='informes' --exclude='media/descargables_internos' \
                --exclude='venv_new' --exclude='__pycache__' --exclude='config' \
                --exclude='data' --exclude='datos' --exclude='facturas' \
                --exclude='herramientas' --exclude='instancias' --exclude='propuestas' \
                --exclude='prototipos' --exclude='reserva' --exclude='workers' \
                --exclude='*.bak*' --exclude='*.disabled' --exclude='_*.py' \
                --exclude='.env' --exclude='.env.*' --exclude='keys.json' --exclude='service_key*' \
                --exclude='*.pem' --exclude='*.tok' --exclude='*.sql' \
                ./ dist/
          # sanity: la web debe estar en dist/
          test -f dist/index.html && echo "OK index.html en dist/"
          test -f dist/CNAME && echo "OK CNAME en dist/"
          du -sh dist

      - name: Deploy a rama gh-pages
